    <text x="584" y="290" fill="#79c0ff" font-size="18">FOCUS</text>
    <text x="734" y="290" fill="#c9d1d9" font-size="18">reliable systems · clear interfaces</text>

    <text x="584" y="332" fill="#79c0ff" font-size="18">STACK</text>
    <text x="734" y="332" fill="#c9d1d9" font-size="18">Java · React · Angular · Kafka</text>

    <text x="584" y="374" fill="#79c0ff" font-size="18">WORK</text>
    <text x="734" y="374" fill="#c9d1d9" font-size="18">automation · infrastructure · GenAI</text>

    <text x="584" y="416" fill="#79c0ff" font-size="18">PROJECTS</text>
    <text x="734" y="416" fill="#c9d1d9" font-size="18">InfraPilot · Cosmic Jetpack Arena</text>
    <text x="734" y="444" fill="#c9d1d9" font-size="18">SolarPlaner</text>

    <text x="584" y="486" fill="#79c0ff" font-size="18">WEB</text>
