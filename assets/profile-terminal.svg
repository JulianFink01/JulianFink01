    <tspan x="56" dy="11.7">               =    -  -*%%#==- =*.                             </tspan>
    <tspan x="56" dy="11.7">                   :- .-*%%+=- =%#*           :                 </tspan>
    <tspan x="56" dy="11.7">               :: +::  -+*+-::+%%%#*-         :-:==             </tspan>
    <tspan x="56" dy="11.7">              -+*+#*+---==--=*+=++=-===+++++==++==-             </tspan>
