<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Julian Fink ASCII profile</title>
  <desc id="desc">A minimal terminal-inspired profile graphic with a high-contrast ASCII portrait derived from Julian Fink's supplied photo and profile details.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-opacity=".25" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="45%" r="54%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="#0d1117"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
