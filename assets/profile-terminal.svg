    <text x="56" y="580" fill="#8b949e" font-size="14">PHOTO → CHARSET / 64 × 43</text>

    <line x1="558" y1="50" x2="558" y2="548" stroke="#30363d" stroke-width="2"/>
    <path d="M584 82h84" stroke="#58a6ff" stroke-width="3"/>
    <text x="584" y="116" fill="#f0f6fc" font-size="32" font-weight="700">julian@fink</text>
    <text x="584" y="148" fill="#8b949e" font-size="16">FULLSTACK DEVELOPER / SWITZERLAND</text>

